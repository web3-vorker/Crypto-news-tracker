<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>news.feed — crypto signal terminal</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap');

    :root {
      --bg: #050807;
      --bg-panel: #0a0f0c;
      --bg-panel-2: #0d1410;
      --border: #1a2a20;
      --border-bright: #234433;
      --green: #3dff8a;
      --green-dim: #1f8050;
      --green-glow: rgba(61, 255, 138, 0.35);
      --amber: #ffb84d;
      --red: #ff5c5c;
      --text: #c9f5dc;
      --text-dim: #5d7a6a;
      --text-mid: #8fb39e;
      --mono: 'JetBrains Mono', 'Fira Code', monospace;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--mono);
      font-size: 13px;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-image:
        radial-gradient(ellipse at top, rgba(61, 255, 138, 0.04), transparent 60%),
        repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.012) 0px, transparent 1px, transparent 2px);
    }

    ::selection {
      background: var(--green-dim);
      color: #000;
    }

    /* ---------- TOP BAR ---------- */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 18px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-panel);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: var(--green);
      text-shadow: 0 0 12px var(--green-glow);
    }

    .brand .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
      animation: pulse 1.6s ease-in-out infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.35;
      }
    }

    .clock {
      color: var(--text-mid);
      font-size: 12px;
    }

    .status-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--text-dim);
      border: 1px solid var(--border);
      padding: 3px 8px;
      border-radius: 3px;
    }

    /* ---------- TICKER ROW ---------- */
    .tickers {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1px;
      background: var(--border);
      border-bottom: 1px solid var(--border);
    }

    .ticker-card {
      background: var(--bg-panel);
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .ticker-left {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }

    .ticker-symbol {
      font-size: 11px;
      color: var(--text-dim);
      letter-spacing: 1px;
    }

    .ticker-price {
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }

    .ticker-change {
      font-size: 12px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .up {
      color: var(--green);
    }

    .down {
      color: var(--red);
    }

    .ticker-spark {
      flex-shrink: 0;
    }

    .ticker-spark svg {
      display: block;
    }

    /* ---------- LAYOUT ---------- */
    .layout {
      display: grid;
      grid-template-columns: 230px 1fr;
      min-height: calc(100vh - 130px);
    }

    /* ---------- SIDEBAR ---------- */
    .sidebar {
      border-right: 1px solid var(--border);
      background: var(--bg-panel);
      padding: 16px 14px;
    }

    .sidebar h3 {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-dim);
      margin: 0 0 10px 0;
      font-weight: 600;
    }

    .filter-group {
      margin-bottom: 22px;
    }

    .filter-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 8px;
      margin-bottom: 2px;
      border-radius: 3px;
      cursor: pointer;
      color: var(--text-mid);
      font-size: 12px;
      transition: background 0.12s, color 0.12s;
    }

    .filter-row:hover {
      background: var(--bg-panel-2);
      color: var(--text);
    }

    .filter-row.active {
      background: rgba(61, 255, 138, 0.08);
      color: var(--green);
      border-left: 2px solid var(--green);
      padding-left: 6px;
    }

    .filter-count {
      font-size: 10px;
      color: var(--text-dim);
    }

    .filter-row.active .filter-count {
      color: var(--green-dim);
    }

    .score-slider-wrap {
      padding: 0 8px;
    }

    .score-slider {
      width: 100%;
      accent-color: var(--green);
      background: transparent;
    }

    .score-label {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-mid);
      margin-top: 4px;
    }

    #score-value {
      color: var(--green);
      font-weight: 700;
    }

    .stat-block {
      margin-top: 8px;
      padding: 10px 8px;
      border-top: 1px solid var(--border);
      font-size: 11px;
      color: var(--text-dim);
      line-height: 1.8;
    }

    .stat-block b {
      color: var(--text-mid);
    }

    .analytics-card {
      padding: 12px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg-panel-2);
      display: grid;
      gap: 8px;
      font-size: 12px;
      color: var(--text-mid);
    }

    .analytics-row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }

    .mood-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      width: fit-content;
    }

    .mood-bullish {
      background: rgba(61, 255, 138, 0.14);
      color: var(--green);
    }

    .mood-bearish {
      background: rgba(255, 92, 92, 0.14);
      color: var(--red);
    }

    .mood-neutral {
      background: rgba(255, 184, 77, 0.14);
      color: var(--amber);
    }

    /* ---------- FEED ---------- */
    .feed {
      padding: 14px 18px;
      overflow-y: auto;
    }

    .feed-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px dashed var(--border);
    }

    .feed-header h2 {
      font-size: 12px;
      color: var(--text-mid);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin: 0;
      font-weight: 600;
    }

    .feed-count {
      font-size: 11px;
      color: var(--text-dim);
    }

    .news-card {
      border: 1px solid var(--border);
      background: var(--bg-panel);
      border-radius: 4px;
      padding: 12px 14px;
      margin-bottom: 8px;
      position: relative;
      transition: border-color 0.15s, transform 0.1s;
      animation: slide-in 0.3s ease-out;
      cursor: pointer;
    }

    .news-card:hover {
      border-color: var(--border-bright);
    }

    .news-card.expanded {
      border-color: var(--green-dim);
      cursor: default;
    }

    @keyframes slide-in {
      from {
        opacity: 0;
        transform: translateY(-4px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .expand-arrow {
      margin-left: 6px;
      color: var(--text-dim);
      font-size: 10px;
      transition: transform 0.15s;
      flex-shrink: 0;
    }

    .news-card.expanded .expand-arrow {
      transform: rotate(90deg);
      color: var(--green);
    }

    .news-detail {
      display: none;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed var(--border);
    }

    .news-card.expanded .news-detail {
      display: block;
      animation: detail-in 0.2s ease-out;
    }

    @keyframes detail-in {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .news-image-wrap {
      width: 100%;
      max-height: 260px;
      overflow: hidden;
      border-radius: 4px;
      border: 1px solid var(--border);
      margin-bottom: 10px;
      background: var(--bg-panel-2);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 60px;
    }

    .news-image-wrap img {
      width: 100%;
      height: auto;
      display: block;
      max-height: 260px;
      object-fit: cover;
    }

    .news-image-loading {
      color: var(--text-dim);
      font-size: 11px;
      padding: 18px;
    }

    .detail-row {
      display: flex;
      gap: 6px;
      font-size: 12px;
      margin-bottom: 6px;
      color: var(--text-mid);
    }

    .detail-row b {
      color: var(--text);
      flex-shrink: 0;
    }

    .news-link-btn {
      display: inline-block;
      margin-top: 8px;
      font-size: 11px;
      color: var(--green);
      border: 1px solid var(--green-dim);
      padding: 4px 10px;
      border-radius: 3px;
      text-decoration: none;
      transition: background 0.12s;
    }

    .news-link-btn:hover {
      background: rgba(61, 255, 138, 0.08);
    }

    .news-top-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
      font-size: 11px;
    }

    .score-badge {
      font-weight: 800;
      padding: 1px 7px;
      border-radius: 3px;
      font-size: 11px;
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
    }

    .score-high {
      background: rgba(255, 92, 92, 0.15);
      color: var(--red);
      border: 1px solid rgba(255, 92, 92, 0.3);
    }

    .score-mid {
      background: rgba(255, 184, 77, 0.15);
      color: var(--amber);
      border: 1px solid rgba(255, 184, 77, 0.3);
    }

    .score-low {
      background: rgba(61, 255, 138, 0.1);
      color: var(--green-dim);
      border: 1px solid rgba(61, 255, 138, 0.2);
    }

    .sentiment-tag {
      font-size: 10px;
      padding: 1px 6px;
      border-radius: 3px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      flex-shrink: 0;
    }

    .sent-bullish {
      color: var(--green);
      border: 1px solid var(--green-dim);
    }

    .sent-bearish {
      color: var(--red);
      border: 1px solid #5c2424;
    }

    .sent-neutral {
      color: var(--text-dim);
      border: 1px solid var(--border);
    }

    .news-source {
      color: var(--text-dim);
    }

    .news-category {
      color: var(--text-mid);
      text-transform: uppercase;
      font-size: 10px;
      letter-spacing: 0.5px;
    }

    .news-time {
      margin-left: auto;
      color: var(--text-dim);
      font-size: 11px;
      flex-shrink: 0;
    }

    .news-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      margin: 4px 0 5px 0;
      line-height: 1.4;
    }

    .news-title a {
      color: inherit;
      text-decoration: none;
    }

    .news-title a:hover {
      color: var(--green);
    }

    .news-abridged {
      color: var(--text-mid);
      font-size: 12.5px;
      line-height: 1.5;
      margin-bottom: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .news-card.expanded .news-abridged {
      white-space: normal;
      margin-bottom: 8px;
    }

    .news-reason {
      font-size: 11.5px;
      color: var(--text-dim);
      border-left: 2px solid var(--border-bright);
      padding-left: 8px;
      line-height: 1.5;
    }

    .news-reason b {
      color: var(--text-mid);
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-dim);
    }

    .empty-state .glyph {
      font-size: 28px;
      margin-bottom: 8px;
      opacity: 0.5;
    }

    /* scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: var(--bg);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border-bright);
      border-radius: 4px;
    }

    @media (max-width: 800px) {
      body {
        font-size: 12px;
      }

      .topbar {
        padding: 8px 12px;
      }

      .brand {
        font-size: 13px;
      }

      .brand span:last-child {
        display: none;
      }

      /* убираем подзаголовок на узких экранах */
      .clock {
        display: none;
      }

      .tickers {
        grid-template-columns: 1fr 1fr 1fr;
      }

      .ticker-card {
        flex-direction: column;
        align-items: flex-start;
        padding: 8px 10px;
        gap: 6px;
      }

      .ticker-price {
        font-size: 15px;
      }

      .ticker-symbol {
        font-size: 9px;
      }

      .ticker-change {
        font-size: 10px;
      }

      .ticker-spark {
        display: none;
      }

      /* спарклайн съедает слишком много места в 3 колонки */

      .layout {
        grid-template-columns: 1fr;
      }

      .sidebar {
        border-right: none;
        border-bottom: 1px solid var(--border);
        padding: 10px 12px;
        display: flex;
        flex-direction: row;
        flex-wrap: nowrap;
        overflow-x: auto;
        gap: 16px;
        -webkit-overflow-scrolling: touch;
      }

      .sidebar h3 {
        display: none;
      }

      /* заголовки групп не нужны в горизонтальной раскладке */
      .filter-group {
        margin-bottom: 0;
        flex-shrink: 0;
        display: flex;
        gap: 6px;
      }

      .filter-row {
        white-space: nowrap;
        padding: 5px 9px;
        margin-bottom: 0;
        border: 1px solid var(--border);
      }

      .filter-row.active {
        padding-left: 9px;
        border-left: 1px solid var(--green);
      }

      .filter-count {
        display: none;
      }

      .score-slider-wrap {
        width: 110px;
        padding: 0 4px;
      }

      #category-list {
        display: flex;
        gap: 6px;
      }

      .stat-block {
        display: none;
      }

      /* служебная инфа не критична на мобильном */

      .feed {
        padding: 10px 12px;
      }

      .feed-header {
        margin-bottom: 8px;
      }

      .news-card {
        padding: 10px 11px;
      }

      .news-top-row {
        flex-wrap: wrap;
        row-gap: 4px;
      }

      .news-time {
        margin-left: 0;
        order: 99;
        width: 100%;
      }

      .news-title {
        font-size: 13px;
      }

      .news-abridged {
        font-size: 12px;
      }

      .news-image-wrap {
        max-height: 180px;
      }

      .news-image-wrap img {
        max-height: 180px;
      }
    }

    @media (max-width: 420px) {
      .ticker-price {
        font-size: 13px;
      }

      .ticker-symbol {
        font-size: 8px;
      }

      .news-title {
        font-size: 12.5px;
      }
    }
  </style>
</head>

<body>

  <div class="topbar">
    <div class="brand"><span class="dot"></span> news.feed <span
        style="color:var(--text-dim); font-weight:400; font-size:11px;">/ crypto signal terminal</span></div>
    <div style="display:flex; align-items:center; gap:14px;">
      <div class="status-pill" id="api-status"><span style="color:var(--green)">●</span> connecting...</div>
      <div class="clock" id="clock">--:--:--</div>
    </div>
  </div>

  <div class="tickers" id="tickers">
    <!-- заполняется JS -->
  </div>

  <div class="layout">
    <div class="sidebar">
      <div class="filter-group">
        <h3>Sentiment</h3>
        <div class="filter-row active" data-filter="sentiment" data-value="">
          <span>Все</span><span class="filter-count" id="cnt-all">0</span>
        </div>
        <div class="filter-row" data-filter="sentiment" data-value="bullish">
          <span style="color:var(--green)">▲ Bullish</span><span class="filter-count" id="cnt-bullish">0</span>
        </div>
        <div class="filter-row" data-filter="sentiment" data-value="bearish">
          <span style="color:var(--red)">▼ Bearish</span><span class="filter-count" id="cnt-bearish">0</span>
        </div>
        <div class="filter-row" data-filter="sentiment" data-value="neutral">
          <span>● Neutral</span><span class="filter-count" id="cnt-neutral">0</span>
        </div>
      </div>

      <div class="filter-group">
        <h3>Min score</h3>
        <div class="score-slider-wrap">
          <input type="range" min="0" max="100" value="0" step="5" class="score-slider" id="score-slider">
          <div class="score-label">
            <span>0</span>
            <span id="score-value">0</span>
            <span>100</span>
          </div>
        </div>
      </div>

      <div class="filter-group">
        <h3>Category</h3>
        <div id="category-list"><!-- заполняется JS --></div>
      </div>

      <div class="filter-group analytics-group">
        <h3>Настрой рынка</h3>
        <div class="analytics-card" id="analytics-card">
          <div class="mood-badge mood-neutral" id="mood-badge">Загрузка...</div>
          <div class="analytics-row"><span>Период</span><span id="analytics-window">24 ч</span></div>
          <div class="analytics-row"><span>Bullish</span><span id="analytics-bullish-count">0</span></div>
          <div class="analytics-row"><span>Bearish</span><span id="analytics-bearish-count">0</span></div>
          <div class="analytics-row"><span>Neutral</span><span id="analytics-neutral-count">0</span></div>
          <div class="analytics-row"><span>Индекс</span><span id="analytics-mood-index">0.000</span></div>
        </div>
      </div>

      <div class="stat-block" id="stat-block">
        <div><b>Источников:</b> —</div>
        <div><b>Обновление:</b> 30s</div>
      </div>
    </div>

    <div class="feed">
      <div class="feed-header">
        <h2>Live feed</h2>
        <span class="feed-count" id="feed-count">0 entries</span>
      </div>
      <div id="news-list">
        <div class="empty-state">
          <div class="glyph">▢</div>загрузка...
        </div>
      </div>
    </div>
  </div>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    // Замени на свой URL Web Service из Render, например:
    // https://crypto-news-api.onrender.com
    const API_BASE = 'https://crypto-news-tracker-api.onrender.com';

    const REFRESH_MS = 30000;
    const PRICES_REFRESH_MS = 30000; // Binance лимиты щедрые, можно опрашивать так же часто

    // ---------- Telegram WebApp ----------
    let tg = null;
    if (window.Telegram && window.Telegram.WebApp) {
      tg = window.Telegram.WebApp;
      tg.ready();
      tg.expand();

      // отдаём Telegram наши цвета, чтобы шапка/фон совпадали с темой сайта
      try {
        tg.setHeaderColor('#050807');
        tg.setBackgroundColor('#050807');
      } catch (e) { /* старые клиенты могут не поддерживать */ }
    }

    let allNews = [];
    let activeSentiment = '';
    let activeCategory = '';
    let minScore = 0;

    // ---------- Часы ----------
    function tickClock() {
      document.getElementById('clock').textContent =
        new Date().toLocaleTimeString('ru-RU', { hour12: false });
    }
    setInterval(tickClock, 1000);
    tickClock();

    // ---------- Spark line SVG ----------
    function buildSparkline(prices, isUp) {
      if (!prices || prices.length < 2) return '';
      const w = 90, h = 32;
      const min = Math.min(...prices), max = Math.max(...prices);
      const range = (max - min) || 1;
      const step = w / (prices.length - 1);

      const points = prices.map((p, i) => {
        const x = i * step;
        const y = h - ((p - min) / range) * h;
        return `${x.toFixed(1)},${y.toFixed(1)}`;
      }).join(' ');

      const color = isUp ? '#3dff8a' : '#ff5c5c';
      const areaPoints = `0,${h} ` + points + ` ${w},${h}`;

      return `
    <svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
      <polyline points="${areaPoints}" fill="${color}" opacity="0.08" />
      <polyline points="${points}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" />
    </svg>`;
    }

    // ---------- Цены ----------
    async function loadPrices() {
      try {
        const res = await fetch(`${API_BASE}/prices`);
        const data = await res.json();
        renderTickers(data);
        setApiStatus(true);
      } catch (e) {
        console.error('prices error', e);
        setApiStatus(false);
      }
    }

    function renderTickers(coins) {
      const wrap = document.getElementById('tickers');
      if (!coins || coins.length === 0) {
        wrap.innerHTML = `<div class="ticker-card"><span style="color:var(--text-dim)">нет данных по ценам</span></div>`;
        return;
      }

      wrap.innerHTML = coins.map(c => {
        const isUp = (c.change_24h || 0) >= 0;
        const changeStr = c.change_24h !== null && c.change_24h !== undefined
          ? `${isUp ? '+' : ''}${c.change_24h.toFixed(2)}%`
          : '—';
        const priceStr = c.price >= 1
          ? c.price.toLocaleString('en-US', { maximumFractionDigits: 2 })
          : c.price.toFixed(6);

        return `
      <div class="ticker-card">
        <div class="ticker-left">
          <div class="ticker-symbol">${c.symbol} / USD</div>
          <div class="ticker-price">$${priceStr}</div>
          <div class="ticker-change ${isUp ? 'up' : 'down'}">${isUp ? '▲' : '▼'} ${changeStr}</div>
        </div>
        <div class="ticker-spark">${buildSparkline(c.sparkline, isUp)}</div>
      </div>`;
      }).join('');
    }

    function setApiStatus(ok) {
      const el = document.getElementById('api-status');
      if (ok) {
        el.innerHTML = '<span style="color:var(--green)">●</span> live';
      } else {
        el.innerHTML = '<span style="color:var(--red)">●</span> offline';
      }
    }

    // ---------- Новости ----------
    async function loadNews() {
      try {
        const res = await fetch(`${API_BASE}/news?limit=200`);
        const data = await res.json();
        allNews = data;
        renderFilters();
        renderNews();
        setApiStatus(true);
      } catch (e) {
        console.error('news error', e);
        setApiStatus(false);
        document.getElementById('news-list').innerHTML =
          `<div class="empty-state"><div class="glyph">⚠</div>API недоступен. Проверь что сервер запущен на ${API_BASE}</div>`;
      }
    }

    function timeAgo(isoStr) {
      if (!isoStr) return '';
      const then = new Date(isoStr);
      const diffMs = Date.now() - then.getTime();
      const diffMin = Math.floor(diffMs / 60000);
      if (diffMin < 1) return 'только что';
      if (diffMin < 60) return `${diffMin}м назад`;
      const diffH = Math.floor(diffMin / 60);
      if (diffH < 24) return `${diffH}ч назад`;
      return `${Math.floor(diffH / 24)}д назад`;
    }

    function scoreClass(score) {
      if (score >= 80) return 'score-high';
      if (score >= 60) return 'score-mid';
      return 'score-low';
    }

    function sentimentClass(s) {
      return { bullish: 'sent-bullish', bearish: 'sent-bearish', neutral: 'sent-neutral' }[s] || 'sent-neutral';
    }

    function sentimentIcon(s) {
      return { bullish: '▲', bearish: '▼', neutral: '●' }[s] || '●';
    }

    function renderFilters() {
      const counts = { bullish: 0, bearish: 0, neutral: 0 };
      const categories = {};

      allNews.forEach(n => {
        if (counts[n.sentiment] !== undefined) counts[n.sentiment]++;
        categories[n.category] = (categories[n.category] || 0) + 1;
      });

      document.getElementById('cnt-all').textContent = allNews.length;
      document.getElementById('cnt-bullish').textContent = counts.bullish;
      document.getElementById('cnt-bearish').textContent = counts.bearish;
      document.getElementById('cnt-neutral').textContent = counts.neutral;

      const catList = document.getElementById('category-list');
      const sortedCats = Object.entries(categories).sort((a, b) => b[1] - a[1]);

      catList.innerHTML = `
    <div class="filter-row ${activeCategory === '' ? 'active' : ''}" data-filter="category" data-value="">
      <span>Все</span><span class="filter-count">${allNews.length}</span>
    </div>
  ` + sortedCats.map(([cat, count]) => `
    <div class="filter-row ${activeCategory === cat ? 'active' : ''}" data-filter="category" data-value="${cat}">
      <span>${cat}</span><span class="filter-count">${count}</span>
    </div>
  `).join('');

      attachFilterHandlers();

      const sources = new Set(allNews.map(n => n.source));
      document.getElementById('stat-block').innerHTML = `
    <div><b>Источников:</b> ${sources.size}</div>
    <div><b>Обновление:</b> 30s</div>
  `;
    }

    function attachFilterHandlers() {
      document.querySelectorAll('[data-filter="sentiment"]').forEach(el => {
        el.onclick = () => {
          activeSentiment = el.dataset.value;
          document.querySelectorAll('[data-filter="sentiment"]').forEach(x => x.classList.remove('active'));
          el.classList.add('active');
          renderNews();
        };
      });
      document.querySelectorAll('[data-filter="category"]').forEach(el => {
        el.onclick = () => {
          activeCategory = el.dataset.value;
          document.querySelectorAll('[data-filter="category"]').forEach(x => x.classList.remove('active'));
          el.classList.add('active');
          renderNews();
        };
      });
    }

    async function loadAnalytics() {
      try {
        const res = await fetch(`${API_BASE}/analytics?hours=24`);
        const analytics = await res.json();
        renderAnalytics(analytics);
        setApiStatus(true);
      } catch (e) {
        console.error('analytics error', e);
      }
    }

    function renderAnalytics(data) {
      if (!data) return;

      const moodBadge = document.getElementById('mood-badge');
      const mood = data.mood || 'neutral';
      const moodText = mood === 'bullish' ? 'Рост' : mood === 'bearish' ? 'Падение' : 'Нейтрально';
      moodBadge.textContent = moodText;
      moodBadge.className = `mood-badge mood-${mood}`;

      document.getElementById('analytics-window').textContent = `${data.hours} ч`;
      document.getElementById('analytics-bullish-count').textContent = data.counts.bullish;
      document.getElementById('analytics-bearish-count').textContent = data.counts.bearish;
      document.getElementById('analytics-neutral-count').textContent = data.counts.neutral;
      document.getElementById('analytics-mood-index').textContent = data.mood_index.toFixed(3);
    }

    // кэш уже запрошенных превью на фронте, чтобы не дёргать /preview повторно
    const previewCache = {};

    function renderNews() {
      let filtered = allNews.filter(n => {
        if (activeSentiment && n.sentiment !== activeSentiment) return false;
        if (activeCategory && n.category !== activeCategory) return false;
        if (n.score < minScore) return false;
        return true;
      });

      document.getElementById('feed-count').textContent = `${filtered.length} entries`;

      const list = document.getElementById('news-list');

      if (filtered.length === 0) {
        list.innerHTML = `<div class="empty-state"><div class="glyph">▢</div>нет новостей по текущим фильтрам</div>`;
        return;
      }

      list.innerHTML = filtered.map((n, i) => `
    <div class="news-card" data-idx="${i}" data-url="${escapeAttr(n.url)}">
      <div class="news-top-row">
        <span class="score-badge ${scoreClass(n.score)}">${n.score}</span>
        <span class="sentiment-tag ${sentimentClass(n.sentiment)}">${sentimentIcon(n.sentiment)} ${n.sentiment}</span>
        <span class="news-category">${n.category}</span>
        <span class="news-source">// ${n.source}</span>
        <span class="news-time">${timeAgo(n.created_at)}</span>
        <span class="expand-arrow">▶</span>
      </div>
      <div class="news-title">${n.title}</div>
      <div class="news-abridged">${n.abridged_text}</div>

      <div class="news-detail">
        <div class="news-image-wrap" data-img-slot>
          <div class="news-image-loading">загрузка превью...</div>
        </div>
        <div class="detail-row"><b>Содержание:</b> <span>${n.abridged_text}</span></div>
        <div class="detail-row"><b>Почему важно:</b> <span>${n.reason}</span></div>
        <div class="detail-row"><b>Источник:</b> <span>${n.source}</span></div>
        <a class="news-link-btn" href="${n.url}" target="_blank" rel="noopener" onclick="event.stopPropagation()">читать оригинал →</a>
      </div>
    </div>
  `).join('');

      // навешиваем обработчики раскрытия
      list.querySelectorAll('.news-card').forEach(card => {
        card.addEventListener('click', () => toggleCard(card));
      });

      // храним отфильтрованный список рядом, чтобы toggleCard мог достать url/данные по idx
      list.dataset.cache = JSON.stringify(filtered.map(n => ({ url: n.url })));
    }

    function escapeAttr(str) {
      return (str || '').replace(/"/g, '&quot;');
    }

    function toggleCard(card) {
      const wasExpanded = card.classList.contains('expanded');

      if (wasExpanded) {
        card.classList.remove('expanded');
        return;
      }

      card.classList.add('expanded');

      const url = card.dataset.url;
      const imgSlot = card.querySelector('[data-img-slot]');

      if (previewCache[url] !== undefined) {
        renderPreviewImage(imgSlot, previewCache[url]);
        return;
      }

      fetch(`${API_BASE}/preview?url=${encodeURIComponent(url)}`)
        .then(r => r.json())
        .then(data => {
          previewCache[url] = data.image;
          renderPreviewImage(imgSlot, data.image);
        })
        .catch(() => {
          previewCache[url] = null;
          renderPreviewImage(imgSlot, null);
        });
    }

    function renderPreviewImage(slot, imageUrl) {
      if (!slot) return;
      if (imageUrl) {
        slot.innerHTML = `<img src="${imageUrl}" alt="" loading="lazy" onerror="this.parentElement.innerHTML='<div class=&quot;news-image-loading&quot;>превью недоступно</div>'">`;
      } else {
        slot.innerHTML = `<div class="news-image-loading">превью недоступно</div>`;
      }
    }

    document.getElementById('score-slider').addEventListener('input', (e) => {
      minScore = parseInt(e.target.value);
      document.getElementById('score-value').textContent = minScore;
      renderNews();
    });

    // ---------- Запуск ----------
    loadPrices();
    loadNews();
    loadAnalytics();
    setInterval(loadPrices, PRICES_REFRESH_MS);
    setInterval(() => {
      loadNews();
      loadAnalytics();
    }, REFRESH_MS);
  </script>

</body>

</html>
