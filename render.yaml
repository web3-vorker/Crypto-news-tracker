databases:
  - name: crypto-news-db
    plan: free
    databaseName: crypto_news
    user: crypto_news

services:
  # Сборщик новостей — на Free плане Render не даёт Background Worker,
  # поэтому запускаем как обычный Web Service с health-check эндпоинтом,
  # а сам while-True цикл крутится в фоне внутри процесса.
  - type: web
    name: crypto-news-worker
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.worker_service
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: crypto-news-db
          property: connectionString
      - key: OPENROUTER_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ALLOWED_USERS
        sync: false
        
  # API — отдаёт новости и цены для дашборда
  - type: web
    name: crypto-news-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.api.api
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: crypto-news-db
          property: connectionString

  # Дашборд — статический сайт
  - type: web
    name: crypto-news-dashboard
    runtime: static
    buildCommand: ""
    staticPublishPath: ./web