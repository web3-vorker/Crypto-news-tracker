databases:
  - name: crypto-news-db
    plan: free
    databaseName: crypto_news
    user: crypto_news

services:
  # Сборщик новостей — постоянно работающий процесс (main.py с while True)
  - type: worker
    name: crypto-news-worker
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.main
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: crypto-news-db
          property: connectionString
      - key: OPENROUTER_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      - key: ALLOWED_USERS
        sync: false

  # API — отдаёт новости и цены для дашборда
  - type: web
    name: crypto-news-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.api.api
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: crypto-news-db
          property: connectionString

  # Дашборд — статический сайт
  - type: web
    name: crypto-news-dashboard
    runtime: static
    buildCommand: ""
    staticPublishPath: ./web